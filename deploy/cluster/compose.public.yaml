services:
  edge:
    image: ${PACKETIA_EDGE_IMAGE:-caddy:2-alpine}
    environment:
      PACKETIA_PUBLIC_HOST: ${PACKETIA_PUBLIC_HOST:-${PACKETIA_DOMAIN}}
      PACKETIA_TLS_CONFIG: ${PACKETIA_TLS_CONFIG:-}
      PACKETIA_HTTPS_PORT: ${PACKETIA_HTTPS_PORT:-443}
    ports:
      - "80:80/tcp"
      - "${PACKETIA_HTTPS_PORT:-443}:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      control:
        condition: service_healthy
      sfu-a:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
